# One Voice V2 — push-triggered CI (Decision 6, ARCHITECTURE §7.6).
# Runs typecheck, dependency-boundary lint, tests, and the production build on
# every push / PR that touches v2/. NO scheduled triggers by design.
name: v2-ci

on:
  push:
    paths:
      - 'v2/**'
      - '.github/workflows/v2-ci.yml'
  pull_request:
    paths:
      - 'v2/**'
      - '.github/workflows/v2-ci.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Dependency-boundary lint
        run: npm run lint
      - name: Tests (Vitest, incl. golden-master parity)
        run: npm test
      - name: Production build
        run: npm run build
